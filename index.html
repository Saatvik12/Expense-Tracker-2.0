<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;500&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--m:#2f2420;--mu:#6f6056;--bd:#e3d9ca;--card:#faf6f0;--moss:#5d6b45}
#app.over{--m:#a8432f}
*{box-sizing:border-box}
body{margin:0;background:#f1ebe2;color:#2f2420;font:16px/1.4 'DM Sans',sans-serif}
main{max-width:460px;margin:auto;padding:24px 18px 120px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1{margin:0;font:300 42px/1.1 Fraunces,serif;color:var(--m)}
h2{margin:0 0 8px;font:500 24px Fraunces,serif}
small{color:var(--mu)}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid #cdbfae;border-radius:10px;background:#fff}
.btn{background:var(--moss);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;min-height:46px}
.btn.alt{background:none;color:var(--mu);border:1px solid #cdbfae}
.r,.a{display:flex;justify-content:space-between;align-items:center;gap:8px}
.a{align-items:baseline}
.ch{font-size:24px;color:var(--mu);min-width:44px;min-height:44px}
.bal{display:flex;gap:12px;align-items:center;margin:14px 0;font-size:13px;color:var(--mu)}
.bal div{flex:1}.bal b{display:block;font-size:17px;color:#2f2420;letter-spacing:.5px}
.sh{border:1px solid #cdbfae;border-radius:999px;padding:0 16px;min-height:40px;font-size:14px}
.cap,.peek{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:14px;color:var(--mu);margin-bottom:12px}
.cap{cursor:pointer}
#app.over .cap{border-color:#d9a89b;background:#f8e7e1}
.a b{font-size:18px;font-weight:600;color:#2f2420}
.bar{height:8px;border-radius:99px;background:#e6dccd;margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:#7c8a5a}
#app.over .bar i{background:#a8432f}
.bad{color:#a8432f;font-weight:600}.amb{color:#9a6a1f;font-weight:600}
.w,.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.w{text-align:center;font-size:12px;color:var(--mu);margin-bottom:6px}
.g{margin-bottom:12px}
.d{aspect-ratio:1/1.15;border-radius:10px;background:#f7f2ea;font-size:13px;padding:6px;text-align:left;vertical-align:top}
.x{background:none}
.h1{background:#f1e0bd}.h2{background:#e6c88f}.h3{background:#dcb27a}.h4{background:#cf935f}
.t{outline:2px solid var(--m);outline-offset:1px}
.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--moss)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd);color:#2f2420}
.row small{display:block}
.row button{font-size:15px;padding:6px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;background:#f1ebe2;border-top:1px solid var(--bd)}
nav div{max-width:460px;margin:auto;display:flex;justify-content:space-around;align-items:center;padding:8px 12px 12px}
nav button{color:var(--mu);font-size:14px;min-height:44px;padding:0 10px}
nav button.on{color:var(--m);font-weight:600}
.add{width:58px;height:58px;border-radius:50%;background:var(--moss);color:#fff!important;font-size:30px!important;line-height:1;padding:0!important;box-shadow:0 6px 16px #5d6b4540}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid #cdbfae;border-radius:12px;padding:8px 14px;min-height:42px}
.seg .on{background:var(--moss);color:#fff;border-color:var(--moss)}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:#2f2420}
dialog::backdrop{background:#2f242088}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pie{width:180px;height:180px;border-radius:50%;margin:16px auto}
.leg{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.leg i{width:12px;height:12px;border-radius:3px}.leg span{flex:1}
.empty{color:var(--mu);text-align:center;padding:16px 0}
</style></head><body>
<main>
<section id="login" hidden>
  <h1>Expense Tracker</h1>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <p><button class="btn" id="go">Sign in</button></p>
</section>

<section id="app" hidden>
  <div class="bal">
    <div>Cash<b id="b1"></b></div><div>FamPay<b id="b2"></b></div><div>Keeper<b id="b3"></b></div>
    <button class="sh" id="sh">Show</button>
  </div>

  <div id="t-cal">
    <div class="r"><h1 id="mt"></h1><div><button class="ch" id="pv" aria-label="Previous month">‹</button><button class="ch" id="nx" aria-label="Next month">›</button></div></div>
    <div class="cap" id="cap" role="button" tabindex="0"></div>
    <div class="w"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div class="g" id="grid"></div>
    <div class="peek" id="peek"></div>
  </div>

  <div id="t-stats" hidden>
    <h2>Where it went</h2>
    <div class="seg" id="rng"><button data-v="week">This week</button><button data-v="month" class="on">This month</button><button data-v="all">All time</button></div>
    <div id="sum"></div>
  </div>

  <div id="t-vault" hidden>
    <h2>Vault</h2>
    <p><small>Keeper moves go through FamPay.</small></p>
    <p><button class="btn" id="kp">Move money</button></p>
    <div class="peek" id="vl"></div>
    <p style="text-align:center"><button class="link sh" id="out">Sign out</button></p>
  </div>
</section>
</main>

<nav id="nav" hidden><div>
  <button data-t="cal" class="on">Calendar</button><button data-t="stats">Stats</button>
  <button class="add" id="add" aria-label="Add entry">+</button>
  <button data-t="vault">Vault</button>
</div></nav>

<dialog id="ed"><form id="ef">
  <h2 id="et">Add entry</h2>
  <div class="seg" id="f-type"><button type="button" data-v="out" class="on">Money out</button><button type="button" data-v="in">Money in</button></div>
  <label>Amount (₹)</label><input id="f-amt" type="number" step="0.01" min="0.01" required inputmode="decimal">
  <label>Paid with</label>
  <div class="seg" id="f-mode"><button type="button" data-v="cash" class="on">Cash</button><button type="button" data-v="fampay">FamPay</button></div>
  <div id="catw"><label>Category</label><div class="seg" id="f-cat"></div></div>
  <div class="two"><div><label>Date</label><input id="f-date" type="date" required></div><div><label>Note</label><input id="f-note"></div></div>
  <div class="two"><button type="button" class="btn alt" data-close>Cancel</button><button class="btn">Save</button></div>
</form></dialog>

<dialog id="kd"><form id="kf">
  <h2>Keeper</h2>
  <div class="seg" id="k-dir"><button type="button" data-v="to_keeper" class="on">Put in</button><button type="button" data-v="from_keeper">Take out</button></div>
  <label>Amount (₹)</label><input id="k-amt" type="number" step="0.01" min="0.01" required inputmode="decimal">
  <div class="two"><div><label>Date</label><input id="k-date" type="date" required></div><div><label>Note</label><input id="k-note"></div></div>
  <div class="two"><button type="button" class="btn alt" data-close>Cancel</button><button class="btn">Save</button></div>
</form></dialog>

<dialog id="cd"><form id="cf">
  <h2>Monthly cap</h2>
  <p><small>You get a warning, and the month turns red, when spending passes this.</small></p>
  <label>Cap (₹)</label><input id="c-amt" type="number" step="1" min="1" inputmode="decimal">
  <label style="display:flex;gap:10px;align-items:center;color:inherit"><input id="c-w" type="checkbox" style="width:20px;height:20px"> Also warn me at 80%</label>
  <div class="two"><button type="button" class="btn alt" id="c-rm">Remove cap</button><button class="btn">Save cap</button></div>
</form></dialog>

<script>
const SUPA_URL = 'https://gmhkyiwvhmiuuopsdkhz.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdtaGt5aXd2aG1pdXVvcHNka2h6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzOTA4OTQsImV4cCI6MjEwNjk2Njg5NH0.RR_NTAqmmTFsarblrqIldSZXG4Ci-9EX6uybaWW7OZ4';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);
const $ = id => document.getElementById(id);
const fmt = n => (n < 0 ? '-₹' : '₹') + Math.abs(n).toLocaleString('en-IN', {maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds = d => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => ds(new Date());
const key = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const COL = ['#cf935f','#7c8a5a','#a8432f','#dcb27a','#8a6a8f','#5f8a8b','#b5894a','#c46a7a','#9a8c7e'];
let uid, entries = [], moves = [], cats = [], cap = null, sel = today(), range = 'month', shown = false, editing = null, timer;
let Y = +sel.slice(0, 4), M = +sel.slice(5, 7) - 1;

async function all(t, o) {
  let r = [], i = 0;
  for (;;) {
    const {data, error} = await sb.from(t).select('*').order(o, {ascending: false}).order('id').range(i, i + 999);
    if (error) { alert(error.message); break; }
    r = r.concat(data);
    if (data.length < 1000) break;
    i += 1000;
  }
  return r;
}
async function load() {
  [entries, moves, cats] = await Promise.all([all('entries', 'entry_date'), all('keeper_moves', 'move_date'), all('categories', 'name')]);
  cap = (await sb.from('settings').select('*').maybeSingle()).data;
  if (!cats.length) {
    await sb.from('categories').insert(['Food','Travel','Fun','Essentials','Other'].map(name => ({name})));
    cats = await all('categories', 'name');
  }
  render();
}

function rowHtml(x) {
  const e = x.k === 'e', d = e ? x.entry_date : x.move_date;
  const title = e ? esc(x.category || (x.type === 'in' ? 'Income' : 'Uncategorised')) : (x.direction === 'to_keeper' ? 'To keeper' : 'From keeper');
  const col = e ? (x.type === 'in' ? '#4f7a3a' : '#a8432f') : '#2f2420', sg = e ? (x.type === 'in' ? '+' : '-') : '';
  return `<div class="row"><div><b>${title}</b><small>${d} · ${e ? (x.mode === 'cash' ? 'Cash' : 'FamPay') : 'FamPay'}${x.note ? ' · ' + esc(x.note) : ''}</small></div>
  <b style="color:${col}">${sg}${fmt(+x.amount)}</b>
  <div><button data-a="edit" data-k="${x.k}" data-id="${x.id}" aria-label="Edit">✎</button><button data-a="del" data-k="${x.k}" data-id="${x.id}" aria-label="Delete">🗑</button></div></div>`;
}

function render() {
  let c = 0, f = 0, k = 0;
  entries.forEach(e => { const s = e.type === 'in' ? 1 : -1; if (e.mode === 'cash') c += s * +e.amount; else f += s * +e.amount; });
  moves.forEach(m => { const a = +m.amount; if (m.direction === 'to_keeper') { f -= a; k += a; } else { f += a; k -= a; } });
  const v = x => shown ? fmt(x) : '••••';
  $('b1').textContent = v(c); $('b2').textContent = v(f); $('b3').textContent = v(k);
  $('sh').textContent = shown ? 'Hide' : 'Show';

  const ym = key(Y, M, 1).slice(0, 7), out = entries.filter(e => e.type === 'out' && e.entry_date.startsWith(ym));
  const spent = out.reduce((s, e) => s + +e.amount, 0), byDay = {};
  out.forEach(e => byDay[e.entry_date] = (byDay[e.entry_date] || 0) + +e.amount);
  const mx = Math.max(0, ...Object.values(byDay));
  $('mt').textContent = MON[M] + (Y !== +today().slice(0, 4) ? ' ' + Y : '');

  const cp = cap && +cap.monthly_cap, over = cp && spent > cp, warn = cp && !over && cap.warn80 && spent >= cp * .8;
  $('app').classList.toggle('over', !!over);
  $('cap').innerHTML = cp
    ? `<div class="a"><span>Monthly cap</span><b>${fmt(spent)} <small>of ${fmt(cp)}</small></b></div><div class="bar"><i style="width:${Math.min(100, spent / cp * 100)}%"></i></div><div class="${over ? 'bad' : warn ? 'amb' : ''}">${over ? fmt(spent - cp) + ' over your cap' : warn ? 'You have used 80% of your cap' : fmt(cp - spent) + ' left this month'}</div>`
    : `<div class="a"><span>Monthly cap</span><b>Set a cap</b></div><div>Spent ${fmt(spent)} so far</div>`;

  const off = (new Date(Y, M, 1).getDay() + 6) % 7, n = new Date(Y, M + 1, 0).getDate(), t = today();
  let h = '<b class="d x"></b>'.repeat(off);
  for (let d = 1; d <= n; d++) {
    const kk = key(Y, M, d), s = byDay[kk] || 0, r = mx ? s / mx : 0;
    const l = !s ? '' : r > .75 ? 'h4' : r > .5 ? 'h3' : r > .25 ? 'h2' : 'h1';
    h += `<button class="d ${l}${kk === t ? ' t' : ''}${kk === sel ? ' sel' : ''}" data-d="${kk}">${d}</button>`;
  }
  $('grid').innerHTML = h;

  const items = entries.filter(e => e.entry_date === sel).map(e => ({...e, k: 'e'})).concat(moves.filter(m => m.move_date === sel).map(m => ({...m, k: 'm'})));
  const day = items.filter(x => x.k === 'e' && x.type === 'out').reduce((s, x) => s + +x.amount, 0);
  $('peek').innerHTML = `<div class="a"><b>${new Date(sel + 'T00:00').toLocaleDateString('en-IN', {weekday: 'short', day: 'numeric', month: 'short'})}</b><span>${day ? fmt(day) + ' spent' : 'Nothing spent'}</span></div>` + items.map(rowHtml).join('');
  $('vl').innerHTML = moves.length ? moves.map(m => rowHtml({...m, k: 'm'})).join('') : '<div class="empty">No keeper moves yet.</div>';
  renderStats();
}

function inRange(d) {
  if (range === 'all') return true;
  const t = today();
  if (range === 'month') return d.slice(0, 7) === t.slice(0, 7);
  const n = new Date(t + 'T00:00'); n.setDate(n.getDate() - (n.getDay() + 6) % 7);
  return d >= ds(n) && d <= t;
}
function renderStats() {
  const out = entries.filter(e => e.type === 'out' && inRange(e.entry_date)), by = {}; let tot = 0;
  out.forEach(e => { const c = e.category || 'Uncategorised'; by[c] = (by[c] || 0) + +e.amount; tot += +e.amount; });
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
  if (!rows.length) { $('sum').innerHTML = '<div class="empty">No expenses in this period.</div>'; return; }
  let acc = 0;
  const grad = rows.map(([, x], i) => { const s = acc / tot * 100; acc += x; return `${COL[i % COL.length]} ${s}% ${acc / tot * 100}%`; }).join(',');
  $('sum').innerHTML = `<div class="pie" style="background:conic-gradient(${grad})"></div><p style="text-align:center">Spent <b>${fmt(tot)}</b></p>` +
    rows.map(([c, x], i) => `<div class="leg"><i style="background:${COL[i % COL.length]}"></i><span>${esc(c)}</span><b>${fmt(x)}</b><small style="width:44px;text-align:right">${(x / tot * 100).toFixed(0)}%</small></div>`).join('');
}

const seg = (id, v) => document.querySelectorAll('#' + id + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
const segv = id => document.querySelector('#' + id + ' .on')?.dataset.v;
function fillCats(sel) {
  const list = cats.map(c => c.name);
  if (sel && !list.includes(sel)) list.unshift(sel);
  $('f-cat').innerHTML = list.map(n => `<button type="button" data-v="${esc(n)}" class="${n === sel ? 'on' : ''}">${esc(n)}</button>`).join('') + '<button type="button" data-v="__new">+ New</button>';
}
function openEntry(x) {
  editing = x ? {k: 'e', id: x.id} : null;
  $('et').textContent = x ? 'Edit entry' : 'Add entry';
  seg('f-type', x ? x.type : 'out'); seg('f-mode', x ? x.mode : 'cash');
  $('catw').hidden = x && x.type === 'in';
  $('f-amt').value = x ? x.amount : ''; $('f-date').value = x ? x.entry_date : sel; $('f-note').value = x ? x.note || '' : '';
  fillCats(x ? x.category : null); $('ed').showModal();
}
function openKeeper(x) {
  editing = x ? {k: 'm', id: x.id} : null;
  seg('k-dir', x ? x.direction : 'to_keeper'); $('k-amt').value = x ? x.amount : '';
  $('k-date').value = x ? x.move_date : sel; $('k-note').value = x ? x.note || '' : ''; $('kd').showModal();
}
async function save(table, row) {
  const {error} = await (editing ? sb.from(table).update(row).eq('id', editing.id) : sb.from(table).insert(row));
  if (error) return alert(error.message);
  document.querySelectorAll('dialog').forEach(d => d.close());
  load();
}
async function setCap(v) {
  const {error} = await sb.from('settings').upsert({user_id: uid, monthly_cap: v, warn80: $('c-w').checked});
  if (error) return alert(error.message + '\nHave you run schema-update.sql?');
  $('cd').close(); load();
}

document.addEventListener('click', async e => {
  const b = e.target.closest('.seg button'); if (!b) return;
  const p = b.parentElement;
  if (b.dataset.v === '__new') {
    const name = (prompt('New category name') || '').trim();
    if (name) {
      const {error} = await sb.from('categories').insert({name});
      if (error && !/duplicate/i.test(error.message)) alert(error.message);
      cats = await all('categories', 'name');
    }
    return fillCats(name || null);
  }
  p.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  if (p.id === 'f-type') $('catw').hidden = b.dataset.v === 'in';
  if (p.id === 'rng') { range = b.dataset.v; renderStats(); }
});
$('ef').onsubmit = e => {
  e.preventDefault();
  const type = segv('f-type'), category = segv('f-cat');
  if (type === 'out' && !category) return alert('Pick a category');
  save('entries', {type, amount: $('f-amt').value, mode: segv('f-mode'), category: type === 'out' ? category : null, note: $('f-note').value.trim() || null, entry_date: $('f-date').value});
};
$('kf').onsubmit = e => {
  e.preventDefault();
  save('keeper_moves', {direction: segv('k-dir'), amount: $('k-amt').value, move_date: $('k-date').value, note: $('k-note').value.trim() || null});
};
$('cf').onsubmit = e => { e.preventDefault(); setCap($('c-amt').value || null); };
$('c-rm').onclick = () => setCap(null);
const openCap = () => { $('c-amt').value = cap && cap.monthly_cap || ''; $('c-w').checked = cap ? cap.warn80 : true; $('cd').showModal(); };
$('cap').onclick = openCap;
$('cap').onkeydown = e => { if (e.key === 'Enter') openCap(); };
const act = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const {a, k, id} = b.dataset, x = (k === 'e' ? entries : moves).find(r => r.id === id);
  if (a === 'edit') return k === 'e' ? openEntry(x) : openKeeper(x);
  if (!confirm('Delete this record?')) return;
  const {error} = await sb.from(k === 'e' ? 'entries' : 'keeper_moves').delete().eq('id', id);
  if (error) alert(error.message); else load();
};
$('peek').onclick = act; $('vl').onclick = act;
$('grid').onclick = e => { const b = e.target.closest('[data-d]'); if (b) { sel = b.dataset.d; render(); } };
const step = n => { M += n; if (M < 0) { M = 11; Y--; } if (M > 11) { M = 0; Y++; } sel = today().startsWith(key(Y, M, 1).slice(0, 7)) ? today() : key(Y, M, 1); render(); };
$('pv').onclick = () => step(-1); $('nx').onclick = () => step(1);
$('sh').onclick = () => { shown = !shown; clearTimeout(timer); if (shown) timer = setTimeout(() => { shown = false; render(); }, 8000); render(); };
$('add').onclick = () => openEntry(); $('kp').onclick = () => openKeeper();
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelectorAll('nav [data-t]').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav [data-t]').forEach(x => x.classList.toggle('on', x === b));
  ['cal', 'stats', 'vault'].forEach(t => $('t-' + t).hidden = t !== b.dataset.t);
});

function show(s) {
  uid = s && s.user.id;
  $('login').hidden = !!s; $('app').hidden = !s; $('nav').hidden = !s;
  if (s) load();
}
$('go').onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email: $('em').value, password: $('pw').value});
  if (error) alert(error.message);
};
$('out').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_, s) => show(s));
sb.auth.getSession().then(({data}) => show(data.session));
</script>
</body></html>
